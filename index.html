<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#229ed9"><link rel="manifest" href="manifest.json"><title>Diccorf</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial;background:#dfe9ef;color:#17212b}button,input{font:inherit}.app{height:100vh;display:flex;flex-direction:column;max-width:1280px;margin:auto;background:#fff}.top{height:64px;background:#229ed9;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}.logo{width:42px;height:42px;border-radius:50%;background:#fff;color:#229ed9;display:grid;place-items:center;font-size:23px;font-weight:bold}.brand{font-weight:bold;font-size:21px}.grow{flex:1}.topbtn,.iconbtn,.round,.primary,.settingBtn{border:0;cursor:pointer}.topbtn{background:#fff;color:#168bc4;border-radius:10px;padding:8px 11px}.iconbtn{width:40px;height:40px;border-radius:50%;background:#168fc8;color:#fff;font-size:20px}.main{flex:1;min-height:0;display:flex}.side{width:350px;border-left:1px solid #ddd;display:flex;flex-direction:column}.sidehead{padding:10px;display:flex;gap:8px;background:#f5f7f8}.search{flex:1;border:0;background:#e9eef1;border-radius:22px;padding:11px}.contacts{overflow:auto}.contact{display:flex;gap:10px;padding:12px;border-bottom:1px solid #eee;cursor:pointer}.contact.active,.contact:hover{background:#eef7fc}.avatar{width:48px;height:48px;flex:none;border-radius:50%;background:#63b5da;color:#fff;display:grid;place-items:center;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.ct{min-width:0;flex:1}.row{display:flex}.name{font-weight:bold;flex:1}.last,.time{font-size:11px;color:#89959d}.last{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{flex:1;display:flex;flex-direction:column;background:#e8f1f5}.chathead{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;padding:0 14px}.chattools{display:flex;gap:5px}.empty{margin:auto;color:#89959d}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:4px}.bubble{max-width:75%;padding:9px 12px;border-radius:15px;line-height:1.7}.me{align-self:flex-start;background:#d7f8c5}.them{align-self:flex-end;background:#fff}.bubble img{max-width:260px;border-radius:12px}.composer{display:flex;gap:8px;padding:9px;background:#fff}.composer input{flex:1;border:0;background:#f1f3f4;border-radius:22px;padding:12px}.round{width:44px;height:44px;border-radius:50%}.attach{background:#eef3f6}.send{background:#229ed9;color:#fff}.login,.modal,.call{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.hide{display:none!important}.box{width:min(430px,100%);background:#fff;border-radius:20px;padding:24px}.box input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:11px}.primary{width:100%;background:#229ed9;color:#fff;padding:12px;border-radius:11px;margin-top:8px}.settingsGrid{display:grid;gap:8px}.settingBtn{width:100%;padding:11px;border-radius:11px;background:#f0f4f6;text-align:right}.danger{background:#ffe9e9;color:#c33}.file{display:none}.callbox{background:#17212b;color:#fff;padding:18px;border-radius:20px;width:min(760px,100%)}.videos{display:flex;gap:8px}.videos video{width:50%;background:#000;border-radius:12px}.red{background:#e53935;color:#fff;border:0;padding:11px 18px;border-radius:11px;margin-top:10px}@media(max-width:720px){.side{width:100%}.chat{display:none}.side.hide{display:none}.chat.show{display:flex}.chatback{display:block}.top{height:58px}.brand{font-size:18px}.messages{padding:12px}.bubble{max-width:84%}}</style></head><body><div class="app"><header class="top"><div class="logo">➤</div><div><div class="brand">Diccorf</div><small id="status">پیام‌رسان وب</small></div><div class="grow"></div><button class="topbtn" id="installBtn">📲 نصب</button><button class="topbtn" id="settingsBtn">⚙️</button></header><main class="main"><aside class="side" id="side"><div class="sidehead"><input id="search" class="search" placeholder="جستجوی گفتگوها"><button class="iconbtn" id="plus">+</button></div><div id="contacts" class="contacts"></div></aside><section class="chat" id="chat"><div class="chathead hide" id="chathead"><button class="iconbtn chatback" id="back">‹</button><div class="avatar" id="headAvatar">D</div><div><b id="headName"></b><div id="headStatus"></div></div><div class="grow"></div><div class="chattools"><button class="iconbtn" id="call">📞</button><button class="iconbtn" id="video">📹</button></div></div><div class="empty" id="empty">یک گفتگو را انتخاب کنید</div><div class="messages hide" id="messages"></div><div class="composer hide" id="composer"><input class="file" type="file" id="file" accept="image/*"><button class="round attach" id="attach">📎</button><input id="msg" placeholder="پیام..."><button class="round send" id="send">➤</button></div></section></main></div><div class="login" id="login"><div class="box"><h2>✈️ ورود به Diccorf</h2><p>شماره موبایل و نامت را وارد کن.</p><input id="phone" inputmode="tel" placeholder="شماره موبایل"><input id="display" placeholder="نام نمایشی"><button class="primary" id="enter">ورود / ساخت حساب</button><small>کد پیامکی ارسال نمی‌شود.</small></div></div><div class="modal hide" id="settings"><div class="box"><button class="settingBtn" id="closeSettings">✕ بستن</button><h2>⚙️ تنظیمات</h2><p id="accountInfo"></p><div class="settingsGrid"><button class="settingBtn" id="rename">✏️ تغییر نام</button><button class="settingBtn" id="changePhone">📱 تغییر شماره</button><button class="settingBtn" id="addContact">➕ افزودن مخاطب</button><button class="settingBtn" id="newGroup">👥 ساخت گروه</button><button class="settingBtn" id="pickAvatar">🖼️ عکس پروفایل</button><button class="settingBtn danger" id="logout">🚪 خروج</button></div><input class="file" type="file" id="avatarFile" accept="image/*"></div></div><div class="call hide" id="callUi"><div class="callbox"><div id="callTitle">تماس</div><div class="videos"><video id="local" autoplay muted playsinline></video><video id="remote" autoplay playsinline></video></div><button class="red" id="hang">قطع تماس</button></div></div><script>
const BASE='https://mainmet.onrender.com',WSURL='wss://mainmet.onrender.com/diccorf';const $=id=>document.getElementById(id);const AUTH='diccorf.auth.v3',DATA='diccorf.masigis.v1';let me=JSON.parse(localStorage.getItem(AUTH)||'null'),chats=JSON.parse(localStorage.getItem(DATA)||'[]'),active=null,ws=null,pc=null,callTo=null,deferred=null;const norm=x=>String(x||'').replace(/[\\s()\\-]/g,'').trim(),now=()=>new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});if(!Array.isArray(chats))chats=[];function save(){localStorage.setItem(DATA,JSON.stringify(chats));if(me)localStorage.setItem(AUTH,JSON.stringify(me))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function addChat(c){let x=chats.find(z=>c.id&&z.id===c.id||c.phone&&norm(z.phone)===norm(c.phone));if(x){Object.assign(x,c);return x}x={...c,messages:c.messages||[]};chats.unshift(x);return x}function render(){const q=($('search').value||'').toLowerCase();$('contacts').innerHTML='';chats.filter(c=>(c.name+' '+(c.phone||'')+' '+(c.messages?.at(-1)?.text||'')).toLowerCase().includes(q)).forEach(c=>{let e=document.createElement('div');e.className='contact '+(active===c.id?'active':'');e.innerHTML='<div class="avatar">'+(c.photo?'<img src="'+c.photo+'">':esc(c.avatar||c.name?.[0]||'?'))+'</div><div class="ct"><div class="row"><div class="name">'+esc(c.name)+'</div><div class="time">'+(c.online?'🟢':'')+'</div></div><div class="last">'+esc(c.typing?'در حال نوشتن...':(c.messages?.at(-1)?.text||'گفتگوی جدید'))+'</div></div>';e.onclick=()=>openChat(c.id);$('contacts').appendChild(e)})}function openChat(id){active=id;let c=chats.find(x=>x.id===id);if(!c)return;$('empty').classList.add('hide');$('chathead').classList.remove('hide');$('messages').classList.remove('hide');$('composer').classList.remove('hide');$('headName').textContent=c.name;$('headStatus').textContent=c.typing?'✍️ در حال نوشتن...':(c.online?'🟢 آنلاین':'⚪ آفلاین');$('headAvatar').innerHTML=c.photo?'<img src="'+c.photo+'">':esc(c.avatar||c.name?.[0]||'?');$('messages').innerHTML=(c.messages||[]).map(m=>'<div class="bubble '+(m.me?'me':'them')+'">'+(m.image?'<img src="'+m.image+'"><div>'+esc(m.text||'')+'</div>':esc(m.text||''))+'</div>').join('');$('messages').scrollTop=$('messages').scrollHeight;render();if(innerWidth<=720){$('side').classList.add('hide');$('chat').classList.add('show')}if(ws?.readyState===1&&c.phone)ws.send(JSON.stringify({type:'history',to:c.phone}))}function login(){let p=norm($('phone').value),n=$('display').value.trim();if(!/^\\+?\\d{8,15}$/.test(p))return alert('شماره موبایل را درست وارد کن.');if(!n)return alert('نام نمایشی را وارد کن.');me={phone:p,name:n,photo:null};save();$('login').classList.add('hide');register();connect();render()}async function register(){try{await fetch(BASE+'/diccorf-register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone,name:me.name})})}catch{}}function connect(){if(!me)return;try{ws=new WebSocket(WSURL)}catch{return}ws.onopen=()=>{ws.send(JSON.stringify({type:'hello',phone:me.phone,name:me.name}));$('status').textContent='🟢 آنلاین'};ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch{}};ws.onclose=()=>{$('status').textContent='⚪ آفلاین';setTimeout(connect,1500)}}function handle(d){if(d.type==='welcome'||d.type==='users'){(d.online||d.users||[]).forEach(p=>{let c=chats.find(x=>norm(x.phone)===norm(p.phone));if(c){c.online=!!p.online;c.name=p.name||c.name}});save();render();return}if(d.type==='presence'){let c=chats.find(x=>norm(x.phone)===norm(d.phone));if(c){c.online=!!d.online;c.name=d.name||c.name;save();render();if(active===c.id)openChat(c.id)}return}if(d.type==='typing'){let c=chats.find(x=>norm(x.phone)===norm(d.from));if(c){c.typing=d.typing;render()};return}if(d.type==='message'||d.type==='sent'){let m=d.message;if(!m)return;let c;if(m.group)c=addChat({id:'g_'+m.group,groupId:m.group,name:m.groupName||'گروه',avatar:'👥',online:true});else c=addChat({id:'u_'+(m.from||m.to),phone:m.from||m.to,name:m.from||m.to,avatar:(m.from||m.to).slice(-1),online:true});c.messages=c.messages||[];if(!c.messages.some(x=>x.id===m.id))c.messages.push({id:m.id,text:m.text||'',image:m.image||'',me:d.type==='sent'||norm(m.from)===norm(me.phone),time:now()});save();render();if(active===c.id)openChat(c.id);return}if(d.type==='group-created'){addChat({id:'g_'+d.group.id,groupId:d.group.id,name:d.group.name,avatar:'👥',online:true,messages:[]});save();render()}if(['call-offer','call-answer','ice','call-end'].includes(d.type))callSignal(d)}function send(){if(!me)return $('login').classList.remove('hide');if(active===null)return;let c=chats.find(x=>x.id===active),t=$('msg').value.trim();if(!c||!t)return;if(c.groupId){ws?.send(JSON.stringify({type:'group-message',group:c.groupId,text:t}));$('msg').value='';return}let o={type:'message',to:c.phone,text:t};if(ws?.readyState===1)ws.send(JSON.stringify(o));else fetch(BASE+'/diccorf-send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:me.phone,name:me.name,to:c.phone,text:t})});$('msg').value=''}async function sendImage(file){if(!file||active===null)return;let c=chats.find(x=>x.id===active);let r=new FileReader();r.onload=()=>{let image=r.result,o={type:'message',to:c.phone,text:'🖼️ عکس',image};if(c.groupId)o={type:'group-message',group:c.groupId,text:'🖼️ عکس',image};ws?.send(JSON.stringify(o))};r.readAsDataURL(file)}function addContact(){let p=norm(prompt('شماره موبایل:'));if(!/^\\+?\\d{8,15}$/.test(p))return;let n=prompt('نام:')||p;addChat({id:'u_'+p,phone:p,name:n,avatar:n[0]||'👤',online:false,messages:[]});save();render()}function newGroup(){let n=prompt('نام گروه:');if(!n)return;let raw=prompt('شماره اعضا با ویرگول:')||'';let members=raw.split(',').map(norm).filter(x=>x&&x!==norm(me.phone));ws?.send(JSON.stringify({type:'create-group',name:n,members}))}async function startCall(video){if(active===null)return;let c=chats.find(x=>x.id===active);if(!c?.phone)return alert('تماس فقط برای مخاطب است.');callTo=c.phone;$('callUi').classList.remove('hide');$('callTitle').textContent=video?'📹 تماس تصویری با '+c.name:'📞 تماس با '+c.name;try{let s=await navigator.mediaDevices.getUserMedia({audio:true,video});$('local').srcObject=s;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});s.getTracks().forEach(t=>pc.addTrack(t,s));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&ws?.send(JSON.stringify({type:'ice',to:callTo,candidate:e.candidate}));let offer=await pc.createOffer();await pc.setLocalDescription(offer);ws?.send(JSON.stringify({type:'call-offer',to:callTo,offer,video}))}catch{endCall()}}async function callSignal(d){if(d.type==='call-end')return endCall();if(d.from)callTo=d.from;$('callUi').classList.remove('hide');if(d.type==='call-offer'){try{let s=await navigator.mediaDevices.getUserMedia({audio:true,video:!!d.video});$('local').srcObject=s;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});s.getTracks().forEach(t=>pc.addTrack(t, s));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&ws?.send(JSON.stringify({type:'ice',to:d.from,candidate:e.candidate}));await pc.setRemoteDescription(d.offer);let a=await pc.createAnswer();await pc.setLocalDescription(a);ws?.send(JSON.stringify({type:'call-answer',to:d.from,answer:a}))}catch{endCall()}}else if(d.type==='call-answer'&&pc)await pc.setRemoteDescription(d.answer);else if(d.type==='ice'&&pc)try{await pc.addIceCandidate(d.candidate)}catch{}}function endCall(){if(pc){pc.close();pc=null}[$('local'),$('remote')].forEach(v=>{if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}});if(callTo)ws?.send(JSON.stringify({type:'call-end',to:callTo}));callTo=null;$('callUi').classList.add('hide')}function setup(){if(me){$('login').classList.add('hide');register();connect()}$('enter').onclick=login;$('send').onclick=send;$('msg').onkeydown=e=>{if(e.key==='Enter')send()};$('search').oninput=render;$('plus').onclick=()=>{let x=prompt('1 مخاطب جدید\\n2 ساخت گروه');if(x==='1')addContact();if(x==='2')newGroup()};$('attach').onclick=()=>$('file').click();$('file').onchange=e=>{sendImage(e.target.files[0]);e.target.value=''};$('call').onclick=()=>startCall(false);$('video').onclick=()=>startCall(true);$('hang').onclick=endCall;$('back').onclick=()=>{$('side').classList.remove('hide');$('chat').classList.remove('show')};$('settingsBtn').onclick=()=>{if(!me)return $('login').classList.remove('hide');$('accountInfo').textContent=me.name+' • '+me.phone;$('settings').classList.remove('hide')};$('closeSettings').onclick=()=>$('settings').classList.add('hide');$('rename').onclick=()=>{let n=prompt('نام جدید:',me.name);if(n){me.name=n.trim();save();register()}};$('changePhone').onclick=()=>{let p=prompt('شماره جدید:',me.phone);if(p&&/^\\+?\\d{8,15}$/.test(p)){me.phone=norm(p);save();register()}};$('addContact').onclick=()=>{addContact();$('settings').classList.add('hide')};$('newGroup').onclick=()=>{newGroup();$('settings').classList.add('hide')};$('logout').onclick=()=>{localStorage.removeItem(AUTH);location.reload()};$('pickAvatar').onclick=()=>$('avatarFile').click();$('avatarFile').onchange=e=>{let r=new FileReader();r.onload=()=>{me.photo=r.result;save()};r.readAsDataURL(e.target.files[0])};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}setup();</script></body></html>
